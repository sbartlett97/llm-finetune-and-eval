run_name: run_lora_r16_2ep
base_model: unsloth/SmolLM3-3B-128K
output_dir: ./checkpoints/run_lora_r16_2ep

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  num_epochs: 2
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  fp16: false
  bf16: true
  seed: 42
  max_seq_length: 2056
  dataloader_num_workers: 4
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
