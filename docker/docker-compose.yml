services:
  serving:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MODEL_RUN_ID=${MODEL_RUN_ID:-run_lora_r16}
      - MODEL_PATH=${MODEL_PATH:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../checkpoints:/app/checkpoints
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    profiles: [serving, full]

  dashboard:
    image: python:3.11-slim
    working_dir: /app
    command: >
      bash -c "pip install streamlit plotly tensorboard httpx pandas --quiet &&
               streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      - SERVING_URL=http://serving:8000
      - RUNS_DIR=/app/runs
    volumes:
      - ../dashboard:/app/dashboard
      - ../runs:/app/runs
    depends_on:
      - serving
    profiles: [full]
